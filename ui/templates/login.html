<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — OmniTrade AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .login-card .logo { margin: 0 auto 14px; width: 52px; height: 52px; font-size: 26px; }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card h1 span { background: linear-gradient(90deg, var(--accent-2), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .login-card input { width: 100%; margin-bottom: 12px; text-align: center; font-size: 15px; padding: 11px; }
  .login-card button { width: 100%; padding: 11px; font-size: 14px; }
  .login-error { color: var(--red); font-size: 12.5px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" method="post" action="/login">
    <div class="logo">◈</div>
    <h1>Omni<span>Trade</span> AI</h1>
    <div class="sub">Panel protegido — introduce la contraseña del .env (UI_PASSWORD)</div>
    {% if error %}<div class="login-error">✖ {{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Contraseña" autofocus autocomplete="current-password">
    <button type="submit" class="primary">Entrar</button>
  </form>
</div>
</body>
</html>
